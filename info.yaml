# Tiny Tapeout project information
project:
  title:        "Simple 4-bit Counter"
  author:       "Steghideeeee"
  discord:      ""
  description:  "A simple 4-bit up counter for Tiny Tapeout"
  language:     "Verilog"
  clock_hz:     10000000       # 10 MHz

  # How many tiles your design occupies?
  tiles: "1x1"

  # GitHub kullanıcı adınla benzersiz yap (Örn: tt_um_ahmet_counter)
  top_module:  "tt_um_steghidess_counter"

  # List your project's source files here.
  source_files:
    - "project.v"
    - "my_counter.v"

# The pinout of your project. 
pinout:
  # Inputs (Sistem clk ve rst donanımsal olarak ayrı gelir, ui pinlerini boş bırakabilirsin)
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (4 bitlik sayacımızı ilk 4 pine bağlıyoruz)
  uo[0]: "count[0]"
  uo[1]: "count[1]"
  uo[2]: "count[2]"
  uo[3]: "count[3]"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (Kullanmıyoruz, boş kalabilir)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

